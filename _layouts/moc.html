---
layout: default
---

<article class="moc-article">
  <p class="moc-back"><a href="{{ '/mocs/' | relative_url }}">All MOCs</a></p>
  {{ content }}
</article>

<dialog class="moc-lightbox" aria-label="Photo viewer">
  <div class="moc-lightbox-toolbar">
    <p class="moc-lightbox-counter" aria-live="polite"></p>
    <button type="button" data-close aria-label="Close photo viewer">Close &times;</button>
  </div>
  <img class="moc-lightbox-image" alt="">
  <div class="moc-lightbox-navigation">
    <button type="button" data-previous aria-label="Previous photo">&larr; Previous</button>
    <button type="button" data-next aria-label="Next photo">Next &rarr;</button>
  </div>
</dialog>
<script src="{{ '/assets/js/moc-gallery.js' | relative_url }}" defer></script>
